name: Confirm connection to DagsHub
on: 
  [workflow_dispatch, pull_request, push]

jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os:  [ubuntu]
    runs-on: ${{ matrix.os }}-latest

    steps:
      - name: checkout contents of PR
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v6
        with:
          # install specific version of UV
          version: "0.6.10"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Cache the virtualenv
        uses: astral-sh/setup-uv@v6
        id: venv_cache
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install venv
        run: |
          uv sync

      - name: Log in to DagsHub
        run: |
          uv run dagshub login --token ${{ secrets.DAGSHUB_TOKEN }}

      - name: Install pip in UV
        run: uv pip install pip

      - name: Check DVC status
        run: |
          uv run dvc remote modify origin --local access_key_id ${{ secrets.DAGSHUB_TOKEN }}
          uv run dvc remote modify origin --local secret_access_key ${{ secrets.DAGSHUB_TOKEN }}
          uv run dvc status
