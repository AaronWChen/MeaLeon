name: Deploy to GitHub Pages
description: 'Create docs with nbdev and deploy to GitHub Pages'
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy_docs:
    runs-on: ubuntu-latest
    
    steps:
      - name: checkout contents of PR
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v6
        with:
          # install specific version of UV
          version: "0.6.10"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Cache the virtualenv
        uses: astral-sh/setup-uv@v6
        id: venv_cache
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install venv
        run: |
          uv sync

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ inputs.ghtoken }}
          force_orphan: true
          publish_dir: ./_docs
          # The following lines assign commit authorship to the official GH-Actions bot for deploys to `gh-pages` branch.
          # You can swap them out with your own user credentials.
          user_name: $GITHUB_ACTOR
          user_email: $GITHUB_ACTOR_ID+$GITHUB_ACTOR@users.noreply.github.com
          publish_branch: ${{ inputs.publish_branch }}