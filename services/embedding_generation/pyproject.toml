[project]
name = "MeaLeon-Embedding-Generator"
version = "0.1.3"
description = "This is the embedding generator environment for MeaLeon: a full stack data science project using machine learning, natural language processing, recommendation engine, and MLOps"
authors = [{ name = "Aaron W. Chen", email = "awc33@cornell.edu" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas",
    "numpy",
    "nltk",
    "scikit-learn",
    "stanza",
    "pydantic",
    "dill",
    "mlflow",
    "torch",
    # "torchaudio",
    "torchvision",
    "sentence_transformers",
    "polars>=1.42.1",
]

[[tool.uv.index]]
name="pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
# torchaudio = { index = "pytorch" }
torchvision = { index = "pytorch" }

[tool.uv]
package = false