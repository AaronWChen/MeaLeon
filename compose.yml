services:
  # postgres database for most data
  db:
    build: ./db/Dockerfile
    restart: always
    environment:
      PG_ROOT_PW_FILE: /run/secrets/db_root_password
      PG_DATABASE: mealeon
      POSTGRES_USER: docker_user
      POSTGRES_PASSWORD: /run/secrets/db_password
    secrets:
      - db_root_password
      - db_password
    ports:
      - ${POSTGRES_DOCKER_PORT}:5432
    volumes: 
      - pgdata:/var/lib/postgresql/data
    networks:
      - mealeon_network
  
  # pgadmin:
  #   image:

  # React frontend
  frontend:
    build: ./frontend/Dockerfile
    
    ports: 
      - "3000:80"
    
    depends_on:
      - backend
    
    environment:
      REACT_APP_API_URL: http://backend:5000
    
    networks:
      - mealeon_network

  # nginx networking proxy
  proxy:
    build: ./network/Dockerfile
    
    networks:
      - mealeon_network

  # flask python app
  backend:
    build: ./backend/Dockerfile
    
    ports:
      - "5000:5000"

    environment:
      POSTGRES_USER: docker_user
      POSTGRES_PASSWORD: /run/secrets/db_password
      POSTGRES_HOST: db:5432

      EDAMAM_API_APPID: /run/secrets/edamam_id
      EDAMAM_API_APPKEY: /run/secrets/edamam_key

      ML_SERVICE_URL: http://ml-service:8000
      VECTOR_DB_URL: http://vector-db:6333
      REDIS_URL: redis://redis:6379
    
    depends_on:
      - db
      - frontend
      - proxy
      - ml-service
    
    networks:
      - mealeon_network

    volumes:
      - ./data:/app/data
      - ./models:/app/models
  
  # create embeddings with ML service
  ml-service:
    build: ./ml-service/Dockerfile

    ports:
      - "8000:8000"

    volumes:
      - ./modeles:/app/models
      - dvc-cache:/root/.dvc/cache
    
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
    networks:
      - mealeon_network
    
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5001
      MODEL_REGISTRY_URI: http://mlflow:5001
      # DVC_REMOTE: s3: dagshub
  
  # MLflow tracking server
  # look at dagshub docs
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2

    ports:
      - "5001:5001"

    volumes:
      - mlflow-artifacts:/mlflow/artifacts
      - ./mlruns:/mlflow/mlruns
    
    environment:
      BACKEND_STORE_URI: 
      DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts

    depends_on:
      - db

    command: > 
      mlflow server
      --backend-store-uri 
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5001

  # Scheduled ML training service
  # look in dagshub docs
  ml-training:
    build: ./ml-training/Dockerfile

    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - dvc-cache:/root/.dvc/cache
      - ~/.aws:/root/.aws:ro 
    
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5001
      MODEL_REGISTRY_URI: http://mlflow:5001
      # DVC_REMOTE: s3: dagshub

    depends:
      - mlflow
      - db

    profiles:
      - training
  
  #need to decide which vector databasea
  vector-db:
    build: ./vector-db
    ports:
      - "6333:6333"
    volumes:
      - vector_data:/

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

secrets:
  db_password:
    file: ./secrets/db_password.txt
  db_root_password:
    file: ./secrets/db_root_password.txt

  edamam_id:
    file: ./secrets/edamam_id.txt
  edamam_key:
    file: ./secrets/edamam_key.txt

volumes:
  pgdata: {}
  vector_data:
  mlflow-artifacts:
  dvc-cache:
