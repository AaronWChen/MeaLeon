[project]
name="MeaLeon"
version = "0.1.19"
description = "MeaLeon suggests recipes for a user to cook! It is a full stack data science project using machine learning, natural language processing, a web form, and AWS. This is the Poetry file to make it easier to deploy and work on the project."
authors = [{ name = "Aaron W. Chen", email = "awc33@cornell.edu" }]
requires-python=">=3.11,<3.12"
license = "GPL-3.0-or-later"
dependencies = [
    "adbc-driver-postgresql>=1.7.0",
    "adjusttext>=1.3.0",
    "aiosmtpd>=1.4.6",
    "arrow-odbc>=9.1.0",
    "bertopic>=0.17.0",
    "bokeh>=3.7.3",
    "boto3>=1.38.27",
    "dagshub>=0.5.10",
    "dill>=0.4.0",
    "dvc>=3.61.0",
    "dvc-s3>=3.2.2",
    "email-validator>=2.2.0",
    "flagembedding>=1.2.11",
    "flask>=2.3.3",
    "flask-babel>=4.0.0",
    "flask-httpauth>=4.8.0",
    "flask-login>=0.6.3",
    "flask-mail>=0.10.0",
    "flask-migrate>=4.1.0",
    "flask-moment>=1.0.6",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.2.2",
    "gensim>=4.3.3",
    "graphviz>=0.21",
    "gunicorn>=23.0.0",
    "hdbscan>=0.8.40",
    "httpie>=3.2.4",
    "importlib-metadata>=8.7.0",
    "importlib-resources>=6.5.2",
    "jupyter>=1.1.1",
    "jupyterlab>=4.4.4",
    "langdetect>=1.0.9",
    "matplotlib>=3.10.3",
    "mlflow>=3.1.1",
    "more-itertools>=10.7.0",
    "nltk>=3.9.1",
    "numpy>=1.26.4",
    "openai>=1.93.1",
    "optuna>=4.4.0",
    "pandas>=2.3.0",
    "polars>=1.31.0",
    "psycopg>=3.2.9",
    "pyjwt>=2.10.1",
    "pymysql>=1.1.1",
    "pyspark>=4.0.0",
    "python-utils>=3.9.1",
    "pyvespa>=0.58.0",
    "requests>=2.32.4",
    "scikit-learn>=1.7.0",
    "scipy>=1.13.1",
    "seaborn>=0.13.2",
    "spacy>=3.8.7",
    "sqlmodel>=0.0.24",
    "stanza>=1.10.1",
    "torch>=2.7.1",
    "torchaudio>=2.7.1",
    "torchvision>=0.22.1",
    "tqdm>=4.67.1",
    "umap-learn>=0.5.9.post2",
    "uvicorn>=0.30.6",
    "waitress>=3.0.2",
    "xgboost>=3.0.2",
    "zipp>=3.23.0",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "pylint>=3.3.7",
    "pytest>=9.0.3",
    "click>=8.0.4",
    "pre-commit>=4",
    "nbqa",
    "ipykernel"
]
app = ["fastapi[all]>=0.112.2"]

[tool.uv]
default-groups = [
    "dev",
    "app",
]

[[tool.uv.index]]
name="pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true


[[tool.uv.index]]
name="PyPI"
url = "https://pypi.org/simple/"
default = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchaudio = { index = "pytorch" }
torchvision = { index = "pytorch" }

[tool.hatch.build.targets.sdist]
include = ["MeaLeon"]

[tool.hatch.build.targets.wheel]
include = ["MeaLeon"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
