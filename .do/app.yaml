# .do/app.yaml
#
# DigitalOcean App Platform spec for MeaLeon.
#
# Deploy with:
#   doctl apps create --spec .do/app.yaml
#   doctl apps update <app-id> --spec .do/app.yaml
#
# Key differences from docker-compose:
#
# 1. Secrets: set once via DO dashboard or doctl, then referenced
#    as ${SECRET_NAME}. DO injects them as env vars — shared/secrets.py
#    reads them transparently.
#
# 2. Service URLs: DO injects ${service-name.PRIVATE_URL} for internal
#    service-to-service communication. These replace localhost/service-name
#    references from docker-compose.
#
# 3. Databases: use DO managed Postgres and Redis add-ons.
#    DO injects DATABASE_URL and REDIS_URL automatically.
#
# 4. Vespa and Neo4j: not supported as managed services on DO App Platform.
#    Options:
#      a) Run as a DO Droplet and reference by private IP
#      b) Use Vespa Cloud (vespa.ai/cloud)
#      c) Use Neo4j AuraDB (free tier available)
#    Their URLs are passed as env vars below.

# Deliberately NOT included yet: recommend-service, embedding-generation,
# mlflow, vespa, neo4j. Stage 1 proves the DO plumbing (builds, secrets,
# private networking, managed DBs, ingress). The recommender itself runs in
# Edamam-fallback mode until stage 2 brings up Vespa + the embedding service.
#
# Verify before applying (docs last verified 5 Nov 2026):
#   - instance_size_slug values: `doctl apps tier instance-size list`
#   - cache engine name (REDIS vs VALKEY) and PG version DO currently offers
#   - ${search-service.PRIVATE_URL} binding; if it does not resolve, add
#     `internal_ports: [8001]` to search-service per the bindable-variables docs
#
# Apply:   doctl apps create --spec .do/app.yaml
# Update:  doctl apps update <app-id> --spec .do/app.yaml

name: mealeon
region: sfo

# ── Managed databases ────────────────────────────────────────────────────

databases:
  - name: db
    engine: PG

  - name: cache
    engine: REDIS # DO may have renamed this to VALKEY; check the current spec reference


# ── Services ─────────────────────────────────────────────────────────────

services:

  # Flask API
  - name: backend
    github:
      repo: AaronWChen/MeaLeon
      branch: main
      deploy_on_push: true
    source_dir: /
    dockerfile_path: backend/Dockerfile
    http_port: 5000
    instance_size_slug: basic-xs
    instance_count: 1
    health_check:
      http_path: /health
      initial_delay_seconds: 30

    envs:
      # DO injects DATABASE_URL from the managed Postgres add-on
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
        type: SECRET

      # DO injects REDIS_URL from the managed Redis add-on
      - key: REDIS_URL
        scope: RUN_TIME
        value: ${cache.DATABASE_URL}
        type: SECRET

      # Internal service URLs — DO injects PRIVATE_URL for each service
      - key: SEARCH_SERVICE_URL
        scope: RUN_TIME
        value: ${search-service.PRIVATE_URL}

      # - key: RECOMMEND_SERVICE_URL
      #   scope: RUN_TIME
      #   value: ${recommend-service.PRIVATE_URL}

      # - key: ML_SERVICE_URL
      #   scope: RUN_TIME
      #   value: ${embedding-generation.PRIVATE_URL}

      # External services (Vespa Cloud / Neo4j AuraDB)
      - key: VESPA_INDEXED
        scope: RUN_TIME
        value: "false"      # stage 1: no Vespa, use the Edamam fallback path

      # - key: NEO4J_URL
      #   scope: RUN_TIME
      #   value: ${NEO4J_URL}   # set in DO dashboard

      - key: SECRET_KEY
        scope: RUN_TIME
        type: SECRET

      - key: FLASK_APP
        scope: RUN_AND_BUILD_TIME
        value: app.py

      # - key: FLASK_ENV
      #   scope: RUN_AND_BUILD_TIME
      #   value: prod

      - key: RUN_MIGRATIONS
        scope: RUN_TIME
        value: "true"

      - key: USE_GUNICORN
        scope: RUN_TIME
        value: "true"

    # routes:
    #   - path: /api
    #   - path: /auth

  - name: search-service
    github:
      repo: AaronWChen/MeaLeon
      branch: main
      deploy_on_push: true
    source_dir: /
    dockerfile_path: search_service/Dockerfile
    http_port: 8001
    instance_size_slug: basic-xxs
    instance_count: 1
    health_check:
      http_path: /health
      initial_delay_seconds: 20

    envs:
      - key: REDIS_URL
        scope: RUN_TIME
        value: ${cache.DATABASE_URL}
        type: SECRET

      # Secrets — set once in DO dashboard, referenced here
      - key: EDAMAM_API_APPID
        scope: RUN_TIME
        type: SECRET

      - key: EDAMAM_API_APPKEY
        scope: RUN_TIME
        type: SECRET

  # - name: recommend-service
  #   github:
  #     repo: AaronWChen/MeaLeon
  #     branch: main
  #     deploy_on_push: true
  #   source_dir: recommend_service
  #   dockerfile_path: recommend_service/Dockerfile
  #   http_port: 8002
  #   instance_size_slug: basic-s
  #   instance_count: 1

  #   envs:
  #     - key: REDIS_URL
  #       scope: RUN_TIME
  #       value: ${mealeon-redis.DATABASE_URL}

  #     - key: VESPA_URL
  #       scope: RUN_TIME
  #       value: ${VESPA_URL}

  #     - key: ML_SERVICE_URL
  #       scope: RUN_TIME
  #       value: ${embedding-generation.PRIVATE_URL}

  #     - key: SEARCH_SERVICE_URL
  #       scope: RUN_TIME
  #       value: ${search-service.PRIVATE_URL}

  # - name: embedding-generation
  #   github:
  #     repo: AaronWChen/MeaLeon
  #     branch: main
  #     deploy_on_push: true
  #   source_dir: embedding_generation
  #   dockerfile_path: embedding_generation/DOCKERFILE
  #   http_port: 8000
  #   # Needs more RAM for PyTorch — professional-xs minimum
  #   instance_size_slug: professional-xs
  #   instance_count: 1

  #   envs:
  #     - key: MLFLOW_TRACKING_URI
  #       scope: RUN_TIME
  #       value: ${MLFLOW_TRACKING_URI}  # set in DO dashboard

  # React/Fite served by nginx
  - name: frontend
    github:
      repo: AaronWChen/MeaLeon
      branch: main
      deploy_on_push: true
    source_dir: frontend
    dockerfile_path: frontend/Dockerfile
    http_port: 80
    instance_size_slug: basic-xxs
    instance_count: 1

    routes:
      - path: /

ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: backend

    - match:
        path:
          prefix: /auth
        component:
          name: backend

    - match:
        path:
          prefix: /
        component:
          name: frontend

